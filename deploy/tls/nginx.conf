# KnowFlow 生产形态 TLS 终结（nginx）
#
# 证书固定路径：
#   /etc/nginx/tls/fullchain.pem
#   /etc/nginx/tls/privkey.pem
# 本地自签证书由 deploy/scripts/generate-self-signed-cert.ps1 生成；
# 生产替换为正式证书后执行 `docker compose ... exec edge nginx -s reload`。
#
# 注意：Host / X-Forwarded-Host 使用 $http_host（保留端口），
# 否则 Web 的同源校验会把 https://host:port 误判为跨源。

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # Web 代理单请求上限为 9MB，这里留一点余量。
    client_max_body_size 10m;

    location / {
        proxy_pass         http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Host  $http_host;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # 问答可能是长响应/流式，禁用缓冲避免边缘截断。
        proxy_buffering    off;
    }
}
