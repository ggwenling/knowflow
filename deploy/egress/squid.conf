# KnowFlow provider egress allowlist (Squid 6.x)
#
# ai 容器不再直连 provider-egress，只能通过本代理出网。代理只放行
# OpenAI 兼容接口所需的两个 provider 域名，其余 CONNECT 一律 403。
# 新增 provider 时必须同时修改本文件和 deploy/env/production.env.example。

http_port 3128
visible_hostname knowflow-egress

acl SSL_ports port 443
acl Safe_ports port 443
acl CONNECT method CONNECT

# 仅精确匹配运行时校验允许的两个 provider 主机。
acl provider_domains dstdomain api.deepseek.com api.siliconflow.cn

http_access deny !Safe_ports
http_access allow CONNECT provider_domains
http_access deny CONNECT
http_access deny all

cache deny all
# squid 进程会降权到 proxy 用户，不能写 /dev/stdout；日志落在可写目录。
access_log /var/log/squid/access.log
cache_log /var/log/squid/cache.log
pid_filename /run/squid.pid
coredump_dir /var/spool/squid
