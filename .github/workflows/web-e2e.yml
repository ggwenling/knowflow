name: Web engineering E2E

on:
  pull_request:
  push:
    branches: [main, local, grok]

jobs:
  evaluation-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Collect public seed through Java with fake providers
        run: uv run --project services/ai --frozen python scripts/e2e-evaluation.py --output /tmp/knowflow-evaluation-smoke.json

  python-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv run --project services/ai --frozen python contracts/validate.py
      - run: python -m unittest contracts.test_openapi_draft10 -v
      - run: uv run --project services/ai --frozen pytest services/ai/tests -q
      - run: python -m unittest discover -s evaluation/smoke -p 'test_*.py' -v

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: bash mvnw -B test
        working-directory: services/api

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/web-v2/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Check legacy proxy and workspace
        working-directory: apps/web
        run: npm ci && npm test
      - name: Install Web v2 dependencies
        working-directory: apps/web-v2
        run: npm ci
      - name: Check Web v2
        working-directory: apps/web-v2
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build
          npm run perf:budget
      - name: Upload Web v2 bundle comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-v2-bundle-budget
          path: apps/web-v2/performance-results/bundle.json
          if-no-files-found: ignore
      - name: Install browser
        working-directory: apps/web-v2
        run: npx playwright install --with-deps chromium
      - name: Run isolated full stack
        run: node scripts/e2e-web.mjs --v2
      - name: Report service state after failure
        if: failure()
        run: docker ps -a --format "table {{.Names}}\t{{.Status}}"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-e2e-results
          path: apps/web-v2/test-results/
          if-no-files-found: ignore
