[project]
name = "knowflow-ai"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.2",
    "pypdf==6.21.4",
    "rfc3339-validator==0.1.4",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["uv_build==0.12.23"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "reportlab==5.1.0",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
