spring:
  application:
    name: knowflow-api
  mvc:
    problemdetails:
      enabled: false
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

knowflow:
  database:
    application:
      url: ${KNOWFLOW_DATABASE_URL:}
      username: ${KNOWFLOW_DATABASE_USERNAME:}
      password: ${KNOWFLOW_DATABASE_PASSWORD:}
    migration:
      url: ${KNOWFLOW_MIGRATION_DATABASE_URL:}
      username: ${KNOWFLOW_MIGRATION_DATABASE_USERNAME:}
      password: ${KNOWFLOW_MIGRATION_DATABASE_PASSWORD:}
  ai:
    base-url: ${KNOWFLOW_AI_BASE_URL:http://localhost:8000}
    internal-shared-secret: ${KNOWFLOW_INTERNAL_SHARED_SECRET:}
